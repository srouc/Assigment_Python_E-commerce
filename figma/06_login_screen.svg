<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#090d16; font-family:'Inter', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient Background Glows -->
  <circle cx="720" cy="450" r="320" fill="url(#glowGrad)" filter="blur(80px)"/>

  <!-- Minimal Header -->
  <g id="Header" transform="translate(0, 0)">
    <rect width="1440" height="70" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <g transform="translate(80, 16)">
      <rect width="36" height="36" rx="10" fill="url(#brandGrad)"/>
      <path d="M12 14 L24 14 L22 24 L14 24 Z" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M15 14 C15 11 21 11 21 14" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <text x="46" y="24" fill="#ffffff" font-size="18" font-weight="900" letter-spacing="-0.5">ShopEase</text>
    </g>
    <!-- Back to Storefront Link -->
    <text x="1360" y="40" fill="#818cf8" font-size="13" font-weight="600" text-anchor="end">← Back to Store</text>
  </g>

  <!-- Center Auth Card (480px width) -->
  <g id="Login-Card" transform="translate(480, 110)" filter="url(#cardShadow)">
    <rect width="480" height="690" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Header Section -->
    <g transform="translate(40, 36)">
      <!-- Logo Icon Badge -->
      <rect x="176" width="48" height="48" rx="14" fill="url(#brandGrad)"/>
      <path d="M194 20 L206 20 L204 30 L196 30 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M197 20 C197 17 203 17 203 20" fill="none" stroke="#ffffff" stroke-width="2"/>

      <text x="200" y="78" fill="#ffffff" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="-0.5">Welcome Back</text>
      <text x="200" y="100" fill="#94a3b8" font-size="13" text-anchor="middle">Enter your credentials to access your ShopEase account</text>
    </g>

    <!-- Quick Demo Logins Container -->
    <g transform="translate(40, 160)">
      <rect width="400" height="74" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="24" fill="#cbd5e1" font-size="11" font-weight="700">⚡ QUICK DEMO LOGINS (ONE-CLICK):</text>
      <g transform="translate(16, 34)">
        <!-- Admin Pill -->
        <rect width="176" height="28" rx="8" fill="#78350f" stroke="#b45309" stroke-width="1"/>
        <text x="88" y="18" fill="#fef3c7" font-size="11" font-weight="700" text-anchor="middle">Admin User (admin@)</text>

        <!-- Customer Pill -->
        <rect x="192" width="176" height="28" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
        <text x="280" y="18" fill="#e0e7ff" font-size="11" font-weight="700" text-anchor="middle">Customer (customer@)</text>
      </g>
    </g>

    <!-- Form Inputs -->
    <g transform="translate(40, 255)">
      <!-- Email Input -->
      <g>
        <text x="0" y="12" fill="#e2e8f0" font-size="12" font-weight="600">Email Address</text>
        <rect y="22" width="400" height="46" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <!-- Mail Icon -->
        <rect x="14" y="37" width="16" height="12" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
        <path d="M14 38 L22 44 L30 38" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="40" y="50" fill="#ffffff" font-size="13">customer@shopease.com</text>
      </g>

      <!-- Password Input -->
      <g transform="translate(0, 90)">
        <div style="display:flex; justify-content:space-between;">
          <text x="0" y="12" fill="#e2e8f0" font-size="12" font-weight="600">Password</text>
          <text x="400" y="12" fill="#818cf8" font-size="11" font-weight="600" text-anchor="end">Forgot Password?</text>
        </div>
        <rect y="22" width="400" height="46" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <!-- Lock Icon -->
        <rect x="15" y="40" width="14" height="11" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
        <path d="M18 40 L18 36 C18 34 26 34 26 36 L26 40" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="40" y="50" fill="#94a3b8" font-size="16" letter-spacing="3">••••••••••••</text>
      </g>

      <!-- Remember Me Checkbox -->
      <g transform="translate(0, 185)">
        <rect width="18" height="18" rx="5" fill="#4f46e5"/>
        <path d="M4 9 L7 12 L14 5" fill="none" stroke="#ffffff" stroke-width="2"/>
        <text x="28" y="14" fill="#cbd5e1" font-size="12">Keep me signed in on this device</text>
      </g>

      <!-- Submit CTA Button -->
      <g transform="translate(0, 225)">
        <rect width="400" height="52" rx="14" fill="#4f46e5"/>
        <text x="200" y="32" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">Sign In to Account →</text>
      </g>

      <!-- Divider -->
      <g transform="translate(0, 305)">
        <line x1="0" y1="0" x2="160" y2="0" stroke="#1e293b" stroke-width="1"/>
        <text x="200" y="4" fill="#64748b" font-size="11" text-anchor="middle">or continue with</text>
        <line x1="240" y1="0" x2="400" y2="0" stroke="#1e293b" stroke-width="1"/>
      </g>

      <!-- Social Logins -->
      <g transform="translate(0, 325)">
        <rect width="192" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="96" y="26" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Google</text>

        <rect x="208" width="192" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="304" y="26" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Apple</text>
      </g>

      <!-- Footer Sign Up Link -->
      <g transform="translate(0, 395)">
        <text x="200" y="12" fill="#94a3b8" font-size="12" text-anchor="middle">
          Don&apos;t have an account? <tspan fill="#818cf8" font-weight="700">Create Account</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
