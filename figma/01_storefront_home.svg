<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1200" width="1440" height="1200" style="background:#090d16; font-family:'Inter', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. TOP ANNOUNCEMENT BAR -->
  <g id="Top-Bar">
    <rect width="1440" height="36" fill="#020617"/>
    <text x="80" y="23" fill="#cbd5e1" font-size="12" font-weight="500">
      ✨ Special Promo: Use code <tspan fill="#f59e0b" font-weight="700">WELCOME10</tspan> for 10% off • Free Express Delivery Over $50 (USD)
    </text>
    <text x="1360" y="23" fill="#94a3b8" font-size="12" text-anchor="end">24/7 Priority Support | USD ($)</text>
  </g>

  <!-- 2. STICKY HEADER -->
  <g id="Navigation-Header" transform="translate(0, 36)">
    <rect width="1440" height="76" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Brand Logo -->
    <g transform="translate(80, 18)">
      <rect width="40" height="40" rx="12" fill="url(#brandGrad)"/>
      <path d="M14 16 L26 16 L24 28 L16 28 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
      <path d="M17 16 C17 13 23 13 23 16" fill="none" stroke="#ffffff" stroke-width="2"/>
      <text x="52" y="22" fill="#ffffff" font-size="20" font-weight="900" letter-spacing="-0.5">ShopEase</text>
      <text x="52" y="34" fill="#6366f1" font-size="9" font-weight="700" letter-spacing="1.5">MODERN STORE</text>
    </g>

    <!-- Search Bar -->
    <g transform="translate(420, 18)">
      <rect width="440" height="40" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="20" r="6" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <line x1="24" y1="24" x2="30" y2="30" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <text x="42" y="25" fill="#64748b" font-size="13">Search premium electronics, apparel, lifestyle...</text>
    </g>

    <!-- Nav Links -->
    <g transform="translate(900, 30)">
      <text x="0" y="12" fill="#818cf8" font-size="14" font-weight="700">Home</text>
      <rect x="0" y="20" width="38" height="2" fill="#6366f1" rx="1"/>
      <text x="70" y="12" fill="#cbd5e1" font-size="14" font-weight="500">Shop All</text>
      <text x="160" y="12" fill="#a78bfa" font-size="14" font-weight="600">🎨 UI/UX Design</text>
      <text x="290" y="12" fill="#cbd5e1" font-size="14" font-weight="500">My Orders</text>
    </g>

    <!-- Cart & User -->
    <g transform="translate(1260, 18)">
      <!-- Cart Icon Button -->
      <rect width="40" height="40" rx="12" fill="#1e293b"/>
      <path d="M12 14 L28 14 L26 26 L14 26 Z" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <circle cx="28" cy="12" r="8" fill="#4f46e5"/>
      <text x="28" y="15" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">2</text>

      <!-- User Avatar -->
      <g transform="translate(52, 0)">
        <rect width="40" height="40" rx="12" fill="url(#brandGrad)"/>
        <text x="20" y="25" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">S</text>
      </g>
    </g>
  </g>

  <!-- 3. HERO BANNER -->
  <g id="Hero-Section" transform="translate(0, 112)">
    <rect width="1440" height="460" fill="#090d16"/>
    <!-- Glow circles -->
    <circle cx="360" cy="180" r="220" fill="#4f46e5" opacity="0.18" filter="blur(60px)"/>
    <circle cx="1100" cy="240" r="240" fill="#7c3aed" opacity="0.14" filter="blur(70px)"/>

    <g transform="translate(80, 70)">
      <!-- Pill Badge -->
      <rect width="260" height="32" rx="16" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#34d399"/>
      <text x="30" y="20" fill="#a5b4fc" font-size="11" font-weight="700">✨ NEW ARRIVAL 2026 LIVE NOW</text>

      <!-- Headline -->
      <text x="0" y="90" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="-1">Crafted for Quality.</text>
      <text x="0" y="150" fill="url(#textGrad)" font-size="52" font-weight="900" letter-spacing="-1">Designed for Life.</text>

      <!-- Subtitle -->
      <text x="0" y="195" fill="#94a3b8" font-size="16" font-weight="400">
        Discover world-class electronics, trending apparel, and artisanal lifestyle essentials
      </text>
      <text x="0" y="220" fill="#94a3b8" font-size="16" font-weight="400">
        with guaranteed authenticity and ultra-fast doorstep delivery across Cambodia.
      </text>

      <!-- CTA Buttons -->
      <g transform="translate(0, 255)">
        <rect width="190" height="52" rx="16" fill="#4f46e5" filter="url(#cardShadow)"/>
        <text x="95" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Explore Catalog →</text>

        <rect x="210" width="180" height="52" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="300" y="32" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">⚡ Electronics</text>
      </g>
    </g>

    <!-- Hero Product Feature Card -->
    <g transform="translate(860, 50)" filter="url(#cardShadow)">
      <rect width="500" height="360" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="24" y="24" width="452" height="220" rx="20" fill="#1e293b"/>
      <!-- Headphone Graphic Representation -->
      <circle cx="250" cy="120" r="50" fill="none" stroke="#6366f1" stroke-width="14"/>
      <rect x="180" y="110" width="24" height="40" rx="10" fill="#818cf8"/>
      <rect x="296" y="110" width="24" height="40" rx="10" fill="#818cf8"/>
      <text x="250" y="195" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle">Sony WH-1000XM5 ANC</text>

      <g transform="translate(24, 260)">
        <text x="0" y="24" fill="#ffffff" font-size="18" font-weight="800">Sony WH-1000XM5 Wireless</text>
        <text x="0" y="44" fill="#38bdf8" font-size="12" font-weight="600">Industry-Leading Noise Cancellation</text>
        <text x="452" y="30" fill="#34d399" font-size="22" font-weight="900" text-anchor="end">$299.00</text>
        <text x="452" y="48" fill="#64748b" font-size="13" text-anchor="end" text-decoration="line-through">$399.00</text>
      </g>
    </g>
  </g>

  <!-- 4. TRUST VALUE PROPOSITIONS -->
  <g id="Trust-Badges" transform="translate(80, 600)">
    <rect width="1280" height="90" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <g transform="translate(40, 25)">
      <circle cx="20" cy="20" r="18" fill="#1e1b4b"/>
      <text x="20" y="25" font-size="16" text-anchor="middle">🚚</text>
      <text x="50" y="18" fill="#ffffff" font-size="13" font-weight="700">Free Express Delivery</text>
      <text x="50" y="32" fill="#64748b" font-size="11">Orders above $50</text>
    </g>

    <g transform="translate(360, 25)">
      <circle cx="20" cy="20" r="18" fill="#1e1b4b"/>
      <text x="20" y="25" font-size="16" text-anchor="middle">🛡️</text>
      <text x="50" y="18" fill="#ffffff" font-size="13" font-weight="700">100% Encrypted Checkout</text>
      <text x="50" y="32" fill="#64748b" font-size="11">KHQR, Cards, &amp; COD</text>
    </g>

    <g transform="translate(680, 25)">
      <circle cx="20" cy="20" r="18" fill="#1e1b4b"/>
      <text x="20" y="25" font-size="16" text-anchor="middle">🔄</text>
      <text x="50" y="18" fill="#ffffff" font-size="13" font-weight="700">30-Day Free Returns</text>
      <text x="50" y="32" fill="#64748b" font-size="11">Hassle-free money back</text>
    </g>

    <g transform="translate(990, 25)">
      <circle cx="20" cy="20" r="18" fill="#1e1b4b"/>
      <text x="20" y="25" font-size="16" text-anchor="middle">🎧</text>
      <text x="50" y="18" fill="#ffffff" font-size="13" font-weight="700">24/7 Priority Support</text>
      <text x="50" y="32" fill="#64748b" font-size="11">Always ready to help</text>
    </g>
  </g>

  <!-- 5. FEATURED CATALOG GRID -->
  <g id="Catalog-Grid" transform="translate(80, 720)">
    <text x="0" y="20" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="-0.5">Featured Collection</text>
    <text x="0" y="42" fill="#64748b" font-size="13">Handpicked premium products with dynamic inventory sync</text>
    <text x="1280" y="25" fill="#818cf8" font-size="13" font-weight="700" text-anchor="end">View All 8 Products →</text>

    <!-- 4 Product Cards -->
    <!-- Card 1 -->
    <g transform="translate(0, 70)" filter="url(#cardShadow)">
      <rect width="295" height="380" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="16" y="16" width="263" height="180" rx="14" fill="#1e293b"/>
      <rect x="26" y="26" width="70" height="24" rx="8" fill="#059669"/>
      <text x="61" y="42" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">-25% OFF</text>
      <text x="16" y="225" fill="#38bdf8" font-size="11" font-weight="700">ELECTRONICS</text>
      <text x="16" y="248" fill="#ffffff" font-size="15" font-weight="800">Sony WH-1000XM5</text>
      <text x="16" y="270" fill="#fbbf24" font-size="12">★★★★★ <tspan fill="#64748b">(4.8)</tspan></text>
      <text x="16" y="302" fill="#ffffff" font-size="20" font-weight="900">$299.00</text>
      <text x="105" y="302" fill="#64748b" font-size="13" text-decoration="line-through">$399.00</text>
      <rect x="16" y="324" width="263" height="40" rx="12" fill="#4f46e5"/>
      <text x="147" y="348" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Add To Cart</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(328, 70)" filter="url(#cardShadow)">
      <rect width="295" height="380" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="16" y="16" width="263" height="180" rx="14" fill="#1e293b"/>
      <rect x="26" y="26" width="60" height="24" rx="8" fill="#4f46e5"/>
      <text x="56" y="42" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">NEW</text>
      <text x="16" y="225" fill="#38bdf8" font-size="11" font-weight="700">ELECTRONICS</text>
      <text x="16" y="248" fill="#ffffff" font-size="15" font-weight="800">Apple Watch Ultra 2</text>
      <text x="16" y="270" fill="#fbbf24" font-size="12">★★★★★ <tspan fill="#64748b">(4.9)</tspan></text>
      <text x="16" y="302" fill="#ffffff" font-size="20" font-weight="900">$799.00</text>
      <rect x="16" y="324" width="263" height="40" rx="12" fill="#4f46e5"/>
      <text x="147" y="348" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Add To Cart</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(656, 70)" filter="url(#cardShadow)">
      <rect width="295" height="380" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="16" y="16" width="263" height="180" rx="14" fill="#1e293b"/>
      <text x="16" y="225" fill="#f43f5e" font-size="11" font-weight="700">FASHION</text>
      <text x="16" y="248" fill="#ffffff" font-size="15" font-weight="800">Nike Air Max Pulse</text>
      <text x="16" y="270" fill="#fbbf24" font-size="12">★★★★★ <tspan fill="#64748b">(4.7)</tspan></text>
      <text x="16" y="302" fill="#ffffff" font-size="20" font-weight="900">$150.00</text>
      <rect x="16" y="324" width="263" height="40" rx="12" fill="#4f46e5"/>
      <text x="147" y="348" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Add To Cart</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(984, 70)" filter="url(#cardShadow)">
      <rect width="295" height="380" rx="20" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <rect x="16" y="16" width="263" height="180" rx="14" fill="#1e293b"/>
      <text x="16" y="225" fill="#38bdf8" font-size="11" font-weight="700">ELECTRONICS</text>
      <text x="16" y="248" fill="#ffffff" font-size="15" font-weight="800">Dell XPS 15 Laptop</text>
      <text x="16" y="270" fill="#fbbf24" font-size="12">★★★★★ <tspan fill="#64748b">(4.8)</tspan></text>
      <text x="16" y="302" fill="#ffffff" font-size="20" font-weight="900">$1,499.00</text>
      <rect x="16" y="324" width="263" height="40" rx="12" fill="#4f46e5"/>
      <text x="147" y="348" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Add To Cart</text>
    </g>
  </g>
</svg>
