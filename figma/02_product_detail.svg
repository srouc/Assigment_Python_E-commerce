<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" style="background:#090d16; font-family:'Inter', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Navigation Header Minimal -->
  <g id="Header" transform="translate(0, 0)">
    <rect width="1440" height="70" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <g transform="translate(80, 16)">
      <rect width="36" height="36" rx="10" fill="url(#brandGrad)"/>
      <text x="46" y="24" fill="#ffffff" font-size="18" font-weight="900">ShopEase</text>
    </g>
    <!-- Back to shop -->
    <text x="1360" y="40" fill="#818cf8" font-size="13" font-weight="600" text-anchor="end">← Back to Catalog</text>
  </g>

  <!-- Breadcrumbs -->
  <g id="Breadcrumbs" transform="translate(80, 100)">
    <text x="0" y="16" fill="#64748b" font-size="13">
      Home <tspan fill="#334155">/</tspan> Electronics <tspan fill="#334155">/</tspan> Headphones <tspan fill="#334155">/</tspan> <tspan fill="#cbd5e1" font-weight="600">Sony WH-1000XM5</tspan>
    </text>
  </g>

  <!-- Main Product View Split -->
  <g id="Product-Split" transform="translate(80, 140)">
    <!-- LEFT: Image Gallery -->
    <g id="Left-Gallery">
      <!-- Main Photo Box -->
      <rect width="600" height="520" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="300" cy="240" r="80" fill="none" stroke="#6366f1" stroke-width="20"/>
      <rect x="200" y="220" width="34" height="60" rx="14" fill="#818cf8"/>
      <rect x="366" y="220" width="34" height="60" rx="14" fill="#818cf8"/>
      <text x="300" y="380" fill="#64748b" font-size="13" text-anchor="middle">Sony WH-1000XM5 Black Edition</text>

      <!-- Thumbnails -->
      <g transform="translate(0, 545)">
        <rect width="100" height="90" rx="16" fill="#1e293b" stroke="#4f46e5" stroke-width="2.5"/>
        <text x="50" y="50" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">Front</text>

        <rect x="120" width="100" height="90" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="170" y="50" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">Side Profile</text>

        <rect x="240" width="100" height="90" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="290" y="50" fill="#64748b" font-size="11" font-weight="600" text-anchor="middle">Case &amp; Cable</text>
      </g>
    </g>

    <!-- RIGHT: Product Details & Purchase Form -->
    <g id="Right-Details" transform="translate(660, 0)">
      <!-- Category & Brand -->
      <rect width="100" height="26" rx="8" fill="#1e1b4b" stroke="#3730a3" stroke-width="1"/>
      <text x="50" y="17" fill="#818cf8" font-size="11" font-weight="700" text-anchor="middle">ELECTRONICS</text>
      <text x="115" y="18" fill="#64748b" font-size="13 font-weight="500"">Brand: <tspan fill="#e2e8f0" font-weight="700">Sony</tspan> • SKU: <tspan fill="#e2e8f0" font-mono>SNY-1000XM5</tspan></text>

      <!-- Title -->
      <text x="0" y="65" fill="#ffffff" font-size="32" font-weight="900" letter-spacing="-0.5">Sony WH-1000XM5 Wireless</text>
      <text x="0" y="100" fill="#ffffff" font-size="32" font-weight="900" letter-spacing="-0.5">Noise-Canceling Headphones</text>

      <!-- Rating & Stock Status -->
      <g transform="translate(0, 125)">
        <text x="0" y="16" fill="#fbbf24" font-size="15">★★★★★</text>
        <text x="80" y="16" fill="#e2e8f0" font-size="13" font-weight="700">4.8</text>
        <text x="105" y="16" fill="#64748b" font-size="13">(12 verified customer reviews)</text>

        <!-- Stock Pill -->
        <rect x="360" y="0" width="150" height="26" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <circle cx="374" cy="13" r="3.5" fill="#34d399"/>
        <text x="440" y="17" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">In Stock (23 Left)</text>
      </g>

      <!-- Price Box -->
      <g transform="translate(0, 180)">
        <text x="0" y="32" fill="#ffffff" font-size="36" font-weight="900">$299.00</text>
        <text x="160" y="32" fill="#64748b" font-size="20" font-weight="600" text-decoration="line-through">$399.00</text>
        <rect x="260" y="8" width="90" height="28" rx="8" fill="#881337" stroke="#be123c" stroke-width="1"/>
        <text x="305" y="26" fill="#f43f5e" font-size="11" font-weight="800" text-anchor="middle">SAVE $100</text>
      </g>

      <!-- Short Description -->
      <g transform="translate(0, 245)">
        <text x="0" y="16" fill="#94a3b8" font-size="14" font-weight="400">
          Two processors control 8 microphones for unprecedented noise cancellation.
        </text>
        <text x="0" y="38" fill="#94a3b8" font-size="14" font-weight="400">
          With Auto NC Optimizer, noise cancelling is automatically optimized based on your
        </text>
        <text x="0" y="60" fill="#94a3b8" font-size="14" font-weight="400">
          wearing conditions and environment. Up to 30-hour battery life with quick charge.
        </text>
      </g>

      <!-- Quantity Stepper & Add to Cart -->
      <g transform="translate(0, 340)">
        <!-- Stepper -->
        <rect width="130" height="54" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
        <text x="25" y="33" fill="#94a3b8" font-size="18" font-weight="700" text-anchor="middle">-</text>
        <text x="65" y="33" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">2</text>
        <text x="105" y="33" fill="#94a3b8" font-size="18" font-weight="700" text-anchor="middle">+</text>

        <!-- CTA Button -->
        <rect x="150" width="340" height="54" rx="16" fill="#4f46e5" filter="url(#shadow)"/>
        <text x="320" y="33" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">Add To Cart • $598.00</text>
      </g>

      <!-- Trust highlights -->
      <g transform="translate(0, 430)">
        <rect width="620" height="110" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="24" y="36" fill="#e2e8f0" font-size="13" font-weight="600">✓ Free Doorstep Delivery Over $50 (Phnom Penh &amp; Provinces)</text>
        <text x="24" y="66" fill="#e2e8f0" font-size="13" font-weight="600">✓ 1-Year Official Manufacturer Warranty Guarantee</text>
        <text x="24" y="96" fill="#e2e8f0" font-size="13" font-weight="600">✓ 30-Day Money-Back Return Policy</text>
      </g>
    </g>
  </g>
</svg>

