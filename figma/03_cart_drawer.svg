<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#090d16; font-family:'Inter', -apple-system, sans-serif;">
  <defs>
    <filter id="drawerShadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="-10" dy="0" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dimmed Background Overlay -->
  <rect width="1440" height="900" fill="#000000" opacity="0.65"/>

  <!-- Cart Slide-over Panel (Right Side: 480px width) -->
  <g id="Cart-Drawer" transform="translate(960, 0)" filter="url(#drawerShadow)">
    <rect width="480" height="900" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

    <!-- Drawer Header -->
    <g transform="translate(32, 32)">
      <text x="0" y="20" fill="#ffffff" font-size="20" font-weight="900">Shopping Cart</text>
      <rect x="145" y="4" width="30" height="22" rx="11" fill="#4f46e5"/>
      <text x="160" y="19" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">2</text>

      <!-- Close Button (X) -->
      <g transform="translate(380, 0)">
        <rect width="36" height="36" rx="10" fill="#1e293b"/>
        <text x="18" y="24" fill="#94a3b8" font-size="16" font-weight="700" text-anchor="middle">✕</text>
      </g>
    </g>

    <!-- Free Delivery Progress Bar -->
    <g transform="translate(32, 85)">
      <rect width="416" height="48" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="16" y="28" fill="#34d399" font-size="12" font-weight="700">🎉 Free Delivery Unlocked! ($50+ Threshold reached)</text>
    </g>

    <!-- Cart Item 1 -->
    <g transform="translate(32, 155)">
      <rect width="416" height="120" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <!-- Thumbnail -->
      <rect x="16" y="16" width="88" height="88" rx="12" fill="#0f172a"/>
      <circle cx="60" cy="60" r="22" fill="none" stroke="#6366f1" stroke-width="6"/>

      <!-- Item Info -->
      <text x="120" y="38" fill="#ffffff" font-size="14" font-weight="800">Sony WH-1000XM5</text>
      <text x="120" y="58" fill="#94a3b8" font-size="12">Color: Black Edition</text>
      <text x="120" y="90" fill="#38bdf8" font-size="15" font-weight="800">$299.00</text>

      <!-- Quantity Stepper -->
      <g transform="translate(240, 70)">
        <rect width="90" height="34" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="15" y="22" fill="#94a3b8" font-size="14" font-weight="700" text-anchor="middle">-</text>
        <text x="45" y="22" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">2</text>
        <text x="75" y="22" fill="#94a3b8" font-size="14" font-weight="700" text-anchor="middle">+</text>
      </g>

      <!-- Delete Button -->
      <g transform="translate(365, 70)">
        <rect width="34" height="34" rx="10" fill="#2d1215" stroke="#7f1d1d" stroke-width="1"/>
        <text x="17" y="22" fill="#f87171" font-size="14" text-anchor="middle">🗑</text>
      </g>
    </g>

    <!-- Coupon Box -->
    <g transform="translate(32, 540)">
      <rect width="416" height="60" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="36" fill="#a5b4fc" font-size="13" font-mono font-weight="700">SAVE15</text>
      <rect x="100" y="16" width="60" height="26" rx="8" fill="#064e3b"/>
      <text x="130" y="33" fill="#34d399" font-size="10" font-weight="800" text-anchor="middle">APPLIED</text>

      <rect x="310" y="12" width="90" height="36" rx="10" fill="#3730a3"/>
      <text x="355" y="34" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Remove</text>
    </g>

    <!-- Subtotals & Summary -->
    <g transform="translate(32, 620)">
      <rect width="416" height="150" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <g transform="translate(20, 24)">
        <text x="0" y="12" fill="#94a3b8" font-size="13">Subtotal (2 items):</text>
        <text x="376" y="12" fill="#ffffff" font-size="13" font-weight="700" text-anchor="end">$598.00</text>

        <text x="0" y="40" fill="#34d399" font-size="13">Coupon Discount (SAVE15):</text>
        <text x="376" y="40" fill="#34d399" font-size="13" font-weight="700" text-anchor="end">-$15.00</text>

        <text x="0" y="68" fill="#94a3b8" font-size="13">Express Shipping:</text>
        <text x="376" y="68" fill="#34d399" font-size="13" font-weight="700" text-anchor="end">FREE</text>

        <line x1="0" y1="84" x2="376" y2="84" stroke="#334155" stroke-width="1"/>

        <text x="0" y="110" fill="#ffffff" font-size="16" font-weight="900">Total Amount:</text>
        <text x="376" y="110" fill="#38bdf8" font-size="20" font-weight="900" text-anchor="end">$583.00</text>
      </g>
    </g>

    <!-- Checkout Primary CTA -->
    <g transform="translate(32, 795)">
      <rect width="416" height="56" rx="18" fill="#4f46e5"/>
      <text x="208" y="34" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">Proceed to Checkout →</text>
    </g>
  </g>
</svg>

